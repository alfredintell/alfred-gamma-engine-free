name: Update Alfred Gamma Levels

on:
  workflow_dispatch:
  schedule:
    - cron: "20 13 * * 1-5"
    - cron: "20 15 * * 1-5"
    - cron: "20 18 * * 1-5"

permissions:
  contents: write

jobs:
  update-gamma:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alfred Gamma Engine
        run: |
          python src/alfred_gamma_engine.py

      - name: Commit generated levels
        run: |
          git config user.name "alfred-gamma-bot"
          git config user.email "alfred-gamma-bot@users.noreply.github.com"
          git add out/
          git diff --cached --quiet || git commit -m "Update Alfred gamma levels"
          git push
