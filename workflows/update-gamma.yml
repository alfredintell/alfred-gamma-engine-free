name: Update Alfred Gamma Levels

on:
  workflow_dispatch:
  schedule:
    # Free proxy updates. Times are UTC. Adjust as needed.
    - cron: "20 13 * * 1-5"
    - cron: "20 15 * * 1-5"
    - cron: "20 18 * * 1-5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build NQ levels
        run: python src/alfred_gamma_engine.py --market NQ --output out

      - name: Build ES levels
        run: python src/alfred_gamma_engine.py --market ES --output out

      - name: Commit updated levels
        run: |
          git config user.name "alfred-gamma-bot"
          git config user.email "actions@users.noreply.github.com"
          git add out/*.json out/*.csv out/*.txt || true
          git commit -m "Update Alfred gamma levels" || echo "No changes to commit"
          git push
